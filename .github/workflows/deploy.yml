name: Выкат на сервер

# Автоматически: после зелёных «Проверок» на main (то есть после каждого слияния PR).
# Вручную: Actions → «Выкат на сервер» → Run workflow (только с ветки main):
#   deploy — выкатить текущий main, rollback — вернуть предыдущую удачную версию.
on:
  workflow_run:
    workflows: ["Проверки"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "deploy — выкатить текущий main, rollback — вернуть предыдущую версию"
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions:
  contents: read

env:
  HOST: 195.133.81.137
  DOMAIN: diagnostics-free.com
  # Отпечаток ключа сервера: защищает от подмены сервера (проверен владельцем 19.10.2026)
  HOST_FINGERPRINT: SHA256:PR3DMvNa51VVboCsO6tRFKEFDrxjxylXQ+BxW5Bjfbk

jobs:
  deploy:
    name: Выкат
    # Ручной запуск — только с main. Автоматический — только после успешных проверок
    # на push в main этого же репозитория (не из форков).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # Окружение production: в настройках GitHub его можно ограничить веткой main
    environment: production
    # Выкаты и откаты строго по одному, не прерываются на середине.
    # Очередь — только на этот шаг, а не на 15-минутную проверку после него.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 75
    steps:
      - name: Какую версию выкатываем
        id: target
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          ACTION: ${{ github.event.inputs.action || 'deploy' }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_run" ]; then sha="$RUN_SHA"; else sha="$DISPATCH_SHA"; fi
          # Перезапуск старых «Проверок» не должен выкатить старый коммит.
          # Откат так не пропускаем: он возвращает версию из истории сервера, а не этот коммит.
          main=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ "$ACTION" != "rollback" ] && [ "$sha" != "$main" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Коммит ${sha:0:7} уже не последний в main (${main:0:7}) — выкат пропущен" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.target.outputs.skip != 'true'
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 50

      - name: Ключ и проверка подлинности сервера
        if: steps.target.outputs.skip != 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Проверяет, что ключ целый, и печатает его отпечаток (сам ключ не выводится)
          bash deploy/prepare-key.sh ~/.ssh/deploy_key
          ssh-keyscan -T 20 -t ed25519 "$HOST" 2>/dev/null > ~/.ssh/known_hosts
          fp=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          if [ "$fp" != "$HOST_FINGERPRINT" ]; then
            echo "::error::Отпечаток сервера не совпадает ($fp) — возможна подмена сервера. Выкат остановлен."
            exit 1
          fi
          echo "Сервер подлинный: $fp"

      - name: Подготовка сервера (повторный запуск безопасен)
        if: steps.target.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ssh_() { ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 "root@$HOST" "$@"; }
          ssh_ 'command -v tmux >/dev/null || (apt-get -o DPkg::Lock::Timeout=600 update -q && DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=600 install -y -q tmux)'
          ssh_ 'mkdir -p /opt/diagnostics/state /opt/diagnostics/logs'
          # Через временный файл и mv: если прошлая подготовка ещё идёт, она дочитает свою копию скрипта
          ssh_ 'cat > /opt/diagnostics/state/setup-server.sh.new && chmod 700 /opt/diagnostics/state/setup-server.sh.new && mv -f /opt/diagnostics/state/setup-server.sh.new /opt/diagnostics/state/setup-server.sh' < deploy/setup-server.sh
          bash deploy/remote-run.sh setup "setup-$(date -u +%Y%m%d-%H%M%S)" "/opt/diagnostics/state/setup-server.sh $DOMAIN" 25

      - name: Список изменений
        if: steps.target.outputs.skip != 'true'
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          prev=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "root@$HOST" 'tail -n 1 /opt/diagnostics/state/history 2>/dev/null || true')
          {
            echo "## Выкат ${SHA:0:7}"
            echo
            if [ -n "$prev" ] && git cat-file -e "$prev" 2>/dev/null; then
              echo "Было: \`${prev:0:7}\`. Что изменилось:"
              echo
              git log --no-merges --format='- %s' "$prev..$SHA"
            else
              echo "Первый выкат или предыдущая версия не найдена в последних 50 коммитах."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Выкат или откат
        if: steps.target.outputs.skip != 'true'
        env:
          SHA: ${{ steps.target.outputs.sha }}
          ACTION: ${{ github.event.inputs.action || 'deploy' }}
        run: |
          set -euo pipefail
          ssh_() { ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 "root@$HOST" "$@"; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Неверный SHA"; exit 1; }
          # Скрипт выката берём из выкатываемой версии, а не из старой на сервере
          # Через временный файл и mv: идущий выкат дочитает свою копию скрипта, а не новую
          ssh_ "cd /opt/diagnostics/app && git fetch --quiet origin $SHA && git show $SHA:deploy/deploy.sh > /opt/diagnostics/state/deploy.sh.new && chmod 700 /opt/diagnostics/state/deploy.sh.new && mv -f /opt/diagnostics/state/deploy.sh.new /opt/diagnostics/state/deploy.sh"
          stamp=$(date -u +%Y%m%d-%H%M%S)
          if [ "$ACTION" = "rollback" ]; then
            bash deploy/remote-run.sh deploy "rollback-$stamp" "/opt/diagnostics/state/deploy.sh rollback" 30
          else
            bash deploy/remote-run.sh deploy "deploy-${SHA:0:7}-$stamp" "/opt/diagnostics/state/deploy.sh deploy $SHA" 30
          fi

      - name: Проверка снаружи
        if: steps.target.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://$DOMAIN/api/health" >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS --max-time 10 "https://$DOMAIN/api/health" | grep -q '"ok"'
          curl -fsS --max-time 10 -o /dev/null "https://$DOMAIN/"
          headers=$(curl -fsSI --max-time 10 "https://$DOMAIN/")
          echo "$headers" | grep -qi '^strict-transport-security'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://$DOMAIN/")
          [ "$code" = "308" ] || [ "$code" = "301" ] || { echo "HTTP не перенаправляет на HTTPS (код $code)"; exit 1; }
          echo "Сайт работает: https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"

      - name: Убрать ключ с машины GitHub
        if: always()
        run: rm -f ~/.ssh/deploy_key

  check-after-15-min:
    name: Проверка через 15 минут
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Ждём 15 минут
        run: sleep 900
      - name: Сайт всё ещё работает
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "https://$DOMAIN/api/health" | grep -q '"ok"'
          curl -fsS --max-time 15 -o /dev/null "https://$DOMAIN/"
          echo "Через 15 минут после выката сайт работает" >> "$GITHUB_STEP_SUMMARY"
