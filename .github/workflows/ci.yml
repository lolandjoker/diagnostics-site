name: Проверки

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Линт, типы, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Линт
        run: pnpm lint

      - name: Проверка скриптов выката (shellcheck)
        run: shellcheck -S warning deploy/*.sh

      - name: Проверка типов
        run: pnpm typecheck

      - name: Тесты
        run: pnpm test

      - name: Сборка
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  audit:
    name: Уязвимости в зависимостях
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm audit (высокие и критические)
        run: pnpm audit --audit-level high

  docker:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -f apps/web/Dockerfile -t diag-web:ci .

      - name: Запуск образа и проверка, что сайт отвечает
        run: |
          docker run -d --name web -p 3000:3000 diag-web:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' web)
            echo "попытка $i: $status"
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$status" = "unhealthy" ]; then docker logs web; exit 1; fi
            sleep 3
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' web)" = "healthy" || { docker logs web; exit 1; }
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          # статика (стили) отдаётся
          css=$(curl -fsS http://127.0.0.1:3000/ | grep -oE '/_next/static/[^"]+\.css' | head -1)
          test -n "$css" && curl -fsS -o /dev/null "http://127.0.0.1:3000$css"
          # служебный заголовок Next скрыт, заголовки безопасности на месте
          headers=$(curl -fsSI http://127.0.0.1:3000/)
          ! echo "$headers" | grep -qi '^x-powered-by'
          echo "$headers" | grep -qi '^x-frame-options: DENY'

      - name: Логи при ошибке
        if: failure()
        run: docker logs web || true
