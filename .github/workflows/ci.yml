name: Проверки

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Линт, типы, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Линт
        run: pnpm lint

      - name: Проверка скриптов выката (shellcheck)
        run: shellcheck -S warning deploy/*.sh

      - name: Проверка типов
        run: pnpm typecheck

      - name: Тесты
        run: pnpm test

      - name: Сборка
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  audit:
    name: Уязвимости в зависимостях
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: pnpm audit (высокие и критические)
        run: pnpm audit --audit-level high

  docker:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: docker build
        run: docker build -f apps/web/Dockerfile -t diag-web:ci .

      - name: Запуск образа с базой и проверка, что сайт отвечает
        run: |
          docker network create ci
          docker run -d --name pg --network ci -e POSTGRES_USER=diag -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=diag postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U diag -d diag && break; sleep 2; done
          docker run -d --name web --network ci -p 3000:3000 \
            -e DATABASE_URL=postgres://diag:ci@pg:5432/diag \
            -e ADMIN_PASSWORD=ci-admin-password -e SESSION_SECRET=ci-session-secret-ci-session-secret \
            diag-web:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' web)
            echo "попытка $i: $status"
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$status" = "unhealthy" ]; then docker logs web; exit 1; fi
            sleep 3
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' web)" = "healthy" || { docker logs web; exit 1; }
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          # статика (стили) отдаётся
          css=$(curl -fsS http://127.0.0.1:3000/ | grep -oE '/_next/static/[^"]+\.css' | head -1)
          test -n "$css" && curl -fsS -o /dev/null "http://127.0.0.1:3000$css"
          # служебный заголовок Next скрыт, заголовки безопасности на месте
          headers=$(curl -fsSI http://127.0.0.1:3000/)
          ! echo "$headers" | grep -qi '^x-powered-by'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
          # главная читает тексты из базы — значит, миграции применились к PostgreSQL
          curl -fsS http://127.0.0.1:3000/ | grep -q 'Получить разбор'
          # админка без входа отправляет на страницу входа
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:3000/admin)" = "http://127.0.0.1:3000/admin/login"

      - name: Логи при ошибке
        if: failure()
        run: docker logs web || true; docker logs pg || true
