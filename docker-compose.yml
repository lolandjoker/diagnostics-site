# Боевой сервер. Запуск: docker compose up -d --build
# Секреты — в файле .env рядом с этим файлом (образец — .env.example).
# База и Redis наружу не открыты: доступны только сайту внутри сети docker.
# turn — сервер для голосовых звонков в чате; его порты открывает файрвол (deploy/setup-server.sh).
# Фоновые задачи (worker) и чат (realtime) добавятся отдельными сервисами по мере готовности.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?укажите SITE_DOMAIN в .env}
      # Прежние домены — переадресация на SITE_DOMAIN (см. deploy/Caddyfile)
      OLD_SITE_DOMAIN: ${OLD_SITE_DOMAIN:-http://old.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Внутри сети docker база и Redis доступны по именам сервисов, а не localhost
      DATABASE_URL: postgres://diag:${POSTGRES_PASSWORD:?укажите POSTGRES_PASSWORD в .env}@postgres:5432/diag
      REDIS_URL: redis://redis:6379
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Голосовые звонки в чате идут между браузерами напрямую, а если напрямую нельзя (мобильный
  # интернет, офисные сети) — через этот TURN-сервер. Сеть хоста — чтобы не пробрасывать диапазон
  # UDP-портов для звука. Пускает только по временным паролям сайта (TURN_SECRET, lib/calls.ts);
  # пересылать трафик во внутренние и служебные сети сервера запрещено (denied-peer-ip).
  turn:
    image: coturn/coturn:4.18-alpine
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      # TLS не нужен (звук и так шифруется в WebRTC); DTLS и консоль в coturn 4.18 выключены по умолчанию
      - --no-tls
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?укажите TURN_SECRET в .env}
      - --realm=${SITE_DOMAIN}
      - --listening-ip=${TURN_IP:?укажите TURN_IP (публичный адрес сервера) в .env}
      - --relay-ip=${TURN_IP}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49260
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --user-quota=12
      - --total-quota=200

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: diag
      POSTGRES_DB: diag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?укажите POSTGRES_PASSWORD в .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diag -d diag"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  redis_data:
